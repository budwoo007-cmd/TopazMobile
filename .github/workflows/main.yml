name: Gerar APK do Topaz Mobile

on:
  workflow_dispatch:
  push:
    paths:
      - "TopazMobile_Final_Corrigido.zip"
      - ".github/workflows/main.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Preparar projeto Topaz
        run: |
          unzip -q TopazMobile_Final_Corrigido.zip -d temp
          cp -r temp/TopazMobileFinal/. .
          rm -rf temp

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 35
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Configurar AndroidX
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
      - name: Compilar APK
        run: |
          gradle assembleRelease --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: TopazMobile-APK
          path: app/build/outputs/apk/release/app-release.apk
